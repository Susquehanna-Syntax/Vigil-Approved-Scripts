name: Prune Docker On Low Disk
uid: 62bac7e3-7ae6-5e5b-bcd3-01348338d99f
author: Connor Haggerty
created: 2026-08-26
description: >-
  When a disk alert at warning or above fires on a host tagged "docker",
  runs Container Host Maintenance on that host: truncates container logs and
  clears stale temp files to free space. On container hosts, logs and temp
  files are usually what fills the disk.
enabled: true

trigger: event
event: alert_sent
min_severity: warning
condition_logic: all
conditions:
  - field: rule
    op: contains
    value: disk
  - field: host_tags
    op: contains
    value: docker

action_kind: playbook
playbook: container-host-maintenance
action_uid: 29d90af5-69fc-5c7b-a4d2-734741abb534

target: event_host
