name: Tag New Container Hosts
uid: 3169fcce-332f-4da3-8e46-62f9ceab86d3
author: Connor Haggerty
created: 2026-10-07
description: >-
  Every time you approve a new host, runs Onboard a Container Host on it.
  Container hosts get the "docker" tag, truncated logs and a first Trivy
  scan; everything else ends as "Not a container host". Tag-targeted
  automations such as Weekly Container Maintenance then find new hosts with
  no one having to remember them.
enabled: true

trigger: event
event: host_approved

action_kind: playbook
playbook: onboard-a-container-host
action_uid: b00d9292-a880-436f-84c9-63d53e8d9846

target: event_host
