name: Clear Temp Files
uid: c6c2e640-2958-54eb-a64f-f6be1870c131
author: Connor Haggerty
created: 2026-08-26
description: >-
  Clears stale files out of the temp directory. Use it on hosts that
  accumulate scratch files and need space back. Files newer than the age you
  supply (7 days by default) are left alone. The run reports how many files
  were removed and how many were skipped because they were in use.
risk: low

inputs:
  - id: older_than_days
    type: number
    label: File age (days)
    description: Only remove files older than this many days.
    default: 7
    required: false

actions:
  - id: clear
    type: clear_temp_files
    params:
      older_than_days: "${{ inputs.older_than_days }}"
    outcome: Temp files cleared
