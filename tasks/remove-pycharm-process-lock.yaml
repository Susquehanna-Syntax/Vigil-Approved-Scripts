name: Remove PyCharm Process Lock
uid: f843c56d-d19f-5143-9d2c-ec742938ca95
author: Connor Haggerty
created: 2026-07-05
description: >-
  Removes the stale PyCharm .lock file that keeps PyCharm from starting after
  an unclean shutdown. Supply the full path to the .lock file at deploy time:
  it sits in the PyCharm config directory, which varies by user, version and
  platform.
risk: high

inputs:
  - id: lock_path
    type: text
    label: PyCharm .lock file path
    description: >-
      Full path to the .lock file, e.g. ~/.config/JetBrains/PyCharm2026.2/.lock
      on Linux or %APPDATA%\JetBrains\PyCharm2026.2\.lock on Windows.
    required: true

actions:
  - id: remove-lock
    type: delete_path
    params:
      path: "${{ inputs.lock_path }}"
    outcome: Lock removed
